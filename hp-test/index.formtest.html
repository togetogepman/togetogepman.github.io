<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>お問い合わせ</title>
  <style>
    :root{--brand:#003E8A;--danger:#B91C1C;--text:#0f172a;--muted:#64748b;--bg:#f8fafc;--card:#fff;--bd:#e2e8f0;--r:8px}
    html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
    .wrap{max-width:920px;margin:64px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,.06)}
    .head{padding:24px;border-bottom:1px solid var(--bd)}
    .head h1{margin:0;font-size:24px}
    .body{padding:24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid-1{grid-template-columns:1fr}
    .field{display:flex;flex-direction:column;gap:8px}
    .label{font-weight:700;display:flex;align-items:center;gap:10px}
    .badge{font-size:12px;padding:2px 8px;border:1px solid var(--danger);color:var(--danger);border-radius:999px}
    .box{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;font:inherit}
    textarea.box{min-height:160px;resize:vertical}
    .help{color:var(--muted);font-size:13px}
    .actions{margin-top:8px;display:flex;gap:12px;align-items:center}
    .btn{appearance:none;border:0;background:var(--brand);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    .msg{margin:0 0 16px;padding:12px;border-radius:12px;display:none}
    .msg.error{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca}
    .msg.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    @media (max-width: 720px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head"><h1>お問い合わせ</h1></div>
      <div class="body">

        <p id="msg-error" class="msg error" aria-live="polite">未入力の項目があります。入力内容をご確認ください。</p>
        <p id="msg-success" class="msg success" aria-live="polite">送信しました。ありがとうございます。</p>

        <iframe name="hidden_iframe" style="display:none;" title="hidden"></iframe>

        <form id="gform"
          action="https://docs.google.com/forms/d/e/1FAIpQLSed8OzEj6umMsSowWS_fsfe0XKxi682Y9WlElkGzdOot6ogFA/formResponse"
          method="POST"
          target="hidden_iframe"
          novalidate>

          <!-- 氏名（姓・名） -->
          <div class="grid">
            <div class="field">
              <div class="label">氏名 <span class="badge">必須</span></div>
              <input id="lastName" class="box" type="text" name="entry.346342012" placeholder="姓">
            </div>
            <div class="field">
              <div class="label" style="visibility:hidden">名</div>
              <input id="firstName" class="box" type="text" name="entry.591847786" placeholder="名">
            </div>
          </div>

          <!-- ふりがな（せい・めい） -->
          <div class="grid" style="margin-top:12px">
            <div class="field">
              <div class="label">ふりがな <span class="badge">必須</span></div>
              <input id="kanaLast" class="box" type="text" name="entry.1525717319" placeholder="せい">
            </div>
            <div class="field">
              <div class="label" style="visibility:hidden">めい</div>
              <input id="kanaFirst" class="box" type="text" name="entry.1044190374" placeholder="めい">
            </div>
          </div>

          <!-- 所属 -->
          <div class="grid grid-1" style="margin-top:12px">
            <div class="field">
              <div class="label">所属 <span class="badge">必須</span></div>
              <input id="company" class="box" type="text" name="entry.2039809426" placeholder="会社・所属名">
            </div>
          </div>

          <!-- メール + 確認 -->
          <div class="grid" style="margin-top:12px">
            <div class="field">
              <div class="label">メールアドレス <span class="badge">必須</span></div>
              <input id="email" class="box" type="email" name="entry.1258844240" placeholder="you@example.com">
            </div>
            <div class="field">
              <div class="label">メールアドレス（確認） <span class="badge">必須</span></div>
              <input id="email2" class="box" type="email" name="entry.859529256" placeholder="確認のため再入力">
            </div>
          </div>

          <!-- お問い合わせ内容 -->
          <div class="grid grid-1" style="margin-top:12px">
            <div class="field">
              <div class="label">お問い合わせ内容 <span class="badge">必須</span></div>
              <textarea id="message" class="box" name="entry.567249329" rows="6" placeholder="ご用件を入力してください"></textarea>
            </div>
          </div>

          <div class="actions">
            <button id="submitBtn" class="btn" type="submit">送信</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('gform');
    const btn  = document.getElementById('submitBtn');
    const msgErr = document.getElementById('msg-error');
    const msgOk  = document.getElementById('msg-success');
    const requiredIds = ['lastName','firstName','kanaLast','kanaFirst','company','email','email2','message'];

    document.querySelector('iframe[name="hidden_iframe"]').addEventListener('load', () => {
      btn.disabled = false;
      msgErr.style.display = 'none';
      msgOk.style.display  = 'block';
      form.reset();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      msgErr.style.display = 'none';
      msgOk.style.display  = 'none';

      for (const id of requiredIds) {
        if (!document.getElementById(id).value.trim()) {
          msgErr.textContent = '未入力の項目があります。入力内容をご確認ください。';
          msgErr.style.display = 'block';
          return;
        }
      }
      if (document.getElementById('email').value.trim() !== document.getElementById('email2').value.trim()) {
        msgErr.textContent = 'メールアドレス（確認）が一致しません。';
        msgErr.style.display = 'block';
        return;
      } else {
        msgErr.textContent = '未入力の項目があります。入力内容をご確認ください。';
      }

      btn.disabled = true;
      form.submit();
    });
  </script>
</body>
</html>
